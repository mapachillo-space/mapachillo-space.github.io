<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Astral Musteloid Art Collective"/>
  <title>Mapachillo Space 🌌</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Comic Neue', cursive;
      background: linear-gradient(145deg, #1e1b30, #2c234d);
      color: #f9f6f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0.5rem 0;
    }
    .logo {
      width: 120px;
      height: auto;
      border-radius: 50%;
      border: 3px solid white;
    }
    section {
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      padding: 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    a {
      color: #ffd3fd;
      text-decoration: none;
    }
    .emoji {
      font-size: 1.2rem;
      margin-right: 0.3rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="/logo192.png" alt="Mapachillo Logo" class="logo" />
    <h1>🌠 Mapachillo Space 🌠</h1>
    <p><em>Astral Musteloid Art Collective</em></p>
  </header>

  <section>
    <h2>About Us</h2>
    <p>Displaced Mexican artists and tinkerers drifting through the void 🪐</p>
  </section>

  <section>
    <h2>Projects</h2>
    <ul>
      <li><strong>🎮 Videogames:</strong> <em>dos de milanesa</em></li>
      <li><strong>⌨️ Keycaps:</strong> 🍚❤️🥛</li>
    </ul>
  </section>

  <section>
    <h2>Connect with Us</h2>
    <p><span class="emoji">🪐</span><a href="https://yourwebsite.com" target="_blank">Website</a></p>
    <p><span class="emoji">💫</span><a href="https://instagram.com/yourhandle" target="_blank">Instagram</a></p>
  </section>

  <footer>
    <p>🌌 made with love in the void · © Mapachillo Collective</p>
  </footer>
</body>
</html>
